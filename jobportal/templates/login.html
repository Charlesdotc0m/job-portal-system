{% extends 'base.html' %}

{% block title %}Login - HireHub{% endblock %}

{% block content %}

<section class="section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-5 col-md-7">

                <div class="dashboard-card candidate-form-card">

                    <div class="text-center mb-4">

                        <div class="category-icon mx-auto mb-3">
                            <i class="bi bi-person-lock"></i>
                        </div>

                        <span class="job-badge">
                            WELCOME BACK
                        </span>

                        <h1 class="section-title mt-3">
                            Login
                        </h1>

                        <p class="section-subtitle">
                            Login to access your HireHub account.
                        </p>

                    </div>

                    {% if error %}
                        <div class="alert alert-danger">
                            {{ error }}
                        </div>
                    {% endif %}

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input type="text"
                                   name="username"
                                   class="form-control"
                                   placeholder="Enter your username"
                                   required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Password
                            </label>

                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   placeholder="Enter your password"
                                   required>

                        </div>

                        <button type="submit"
                                class="btn btn-purple w-100 py-2">

                            <i class="bi bi-box-arrow-in-right me-2"></i>
                            Login

                        </button>

                    </form>

                    <div class="text-center mt-4">

                        <p class="text-muted mb-0">
                            Don't have an account?
                            <a href="{% url 'candidate_register' %}">
                                Register
                            </a>
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
